<div class="govuk-grid-column-full">
  <opal-lib-custom-page-header>
    <ng-container pageHeaderHeading>
      <h1 class="govuk-heading-l">{{ isInbound ? 'Inbound' : 'Outbound' }} interface files</h1>
    </ng-container>
  </opal-lib-custom-page-header>

  <opal-lib-custom-file-interface-viewer-filters
    [isInbound]="isInbound"
    [businessUnits]="businessUnits"
    [source]="source"
    [sourceList]="sourceList"
    (formSubmit)="formSubmit.emit($event)"
  >
  </opal-lib-custom-file-interface-viewer-filters>

  <hr class="govuk-section-break govuk-section-break--m govuk-section-break--visible" />

  <div [id]="isInbound ? 'inbound-interface-files-results' : 'outbound-interface-files-results'" tabindex="-1">
    @if (tableData !== null) {
      @if (tableData.length > 0) {
        <opal-lib-custom-file-interface-viewer-table-wrapper
          [isInbound]="isInbound"
          [existingSortState]="tableSort"
          [tableData]="tableData"
          [actionTemplate]="actionTemplate"
        ></opal-lib-custom-file-interface-viewer-table-wrapper>
      } @else {
        <p class="govuk-body">There are no {{ isInbound ? 'inbound' : 'outbound' }} interface files to display.</p>
      }
    }
  </div>
</div>
