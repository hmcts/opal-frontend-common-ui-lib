@if (isVisible) {
  <span class="govuk-visually-hidden" [attr.role]="announcementRole">
    {{ announcementText }}
  </span>
  <ng-content select="[icon]"></ng-content>
  <ng-content select="[content]"></ng-content>

  @if (showDismiss) {
    <opal-lib-moj-alert-dismiss (dismiss)="dismiss()"></opal-lib-moj-alert-dismiss>
  }
}
